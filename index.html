<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VIDAA Cursor Test</title>
<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}
#info {
    position:absolute;
    top:40px;
    left:40px;
    font-size:32px;
}
#button {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:40px 80px;
    background:#444;
    border-radius:20px;
    font-size:42px;
}
#cursor {
    position:absolute;
    width:28px;
    height:28px;
    border:4px solid red;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<div id="info">Usa ← ↑ → ↓ per muovere il cursore — OK per cliccare</div>
<div id="button">CLICCAMI</div>
<div id="cursor"></div>

<script>
let x = window.innerWidth / 2;
let y = window.innerHeight / 2;
const step = 30;

const cursor = document.getElementById("cursor");
const button = document.getElementById("button");

function draw() {
    cursor.style.left = x + "px";
    cursor.style.top = y + "px";
}

function clickAtCursor() {
    const el = document.elementFromPoint(x, y);
    if (el) el.click();
}

button.onclick = function() {
    button.textContent = "FUNZIONA!";
    button.style.background = "#087f23";
};

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft")  x -= step;
    if (e.key === "ArrowRight") x += step;
    if (e.key === "ArrowUp")    y -= step;
    if (e.key === "ArrowDown")  y += step;

    if (e.key === "Enter" || e.key === "OK") {
        clickAtCursor();
    }

    x = Math.max(15, Math.min(window.innerWidth - 15, x));
    y = Math.max(15, Math.min(window.innerHeight - 15, y));

    draw();
});

draw();
</script>

</body>
</html>
