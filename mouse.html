<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIDAA Mouse Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

#cursor {
    position: fixed;

    width: 34px;
    height: 34px;

    background: red;
    border: 4px solid white;
    border-radius: 50%;

    z-index: 999999;
    pointer-events: none;

    transform: translate(-50%, -50%);
}

#webButton {
    position: fixed;

    right: 40px;
    top: 40px;

    z-index: 999998;

    padding: 25px 40px;

    font-size: 28px;
}
</style>
</head>

<body>

<button id="webButton">
    APRI WIKIPEDIA
</button>

<div id="cursor"></div>

<script>

let x = window.innerWidth / 2;
let y = window.innerHeight / 2;

const speed = 22;

const cursor = document.getElementById("cursor");
const webButton = document.getElementById("webButton");


function updateCursor() {

    cursor.style.left = x + "px";
    cursor.style.top = y + "px";

}


function clickAtCursor() {

    const element = document.elementFromPoint(x, y);

    if (element === webButton) {

        location.href = "https://it.wikipedia.org/wiki/Italia";

    }

}


document.addEventListener("keydown", function(event) {

    switch (event.key) {

        case "ArrowLeft":
            x -= speed;
            break;

        case "ArrowRight":
            x += speed;
            break;

        case "ArrowUp":
            y -= speed;
            break;

        case "ArrowDown":
            y += speed;
            break;

        case "Enter":
        case "OK":
        case "Accept":
            clickAtCursor();
            break;
    }


    if (x < 5)
        x = 5;

    if (x > window.innerWidth - 5)
        x = window.innerWidth - 5;

    if (y < 5)
        y = 5;

    if (y > window.innerHeight - 5)
        y = window.innerHeight - 5;


    updateCursor();

});


updateCursor();

</script>

</body>
</html>
