<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VIDAA iframe test</title>
<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

iframe {
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    border:0;
}

#cursor {
    position:fixed;
    width:28px;
    height:28px;
    border:4px solid red;
    border-radius:50%;
    pointer-events:none;
    z-index:999999;
    transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<iframe src="https://example.com"></iframe>
<div id="cursor"></div>

<script>
let x = innerWidth / 2;
let y = innerHeight / 2;
const step = 30;
const cursor = document.getElementById("cursor");

function draw() {
    cursor.style.left = x + "px";
    cursor.style.top = y + "px";
}

document.addEventListener("keydown", e => {

    if (e.key === "ArrowLeft")  x -= step;
    if (e.key === "ArrowRight") x += step;
    if (e.key === "ArrowUp")    y -= step;
    if (e.key === "ArrowDown")  y += step;

    x = Math.max(15, Math.min(innerWidth - 15, x));
    y = Math.max(15, Math.min(innerHeight - 15, y));

    draw();
});

draw();
</script>

</body>
</html>
